<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galleria d'Arte</title>

    <!-- Bootstrap -->
    <link rel="stylesheet" href="./bootstrap5/bootstrap.min.css" >
    <link rel="stylesheet" href="./bootstrap5/bootstrap-icons.min.css">
    <script defer src="./bootstrap5/bootstrap.bundle.min.js"></script>

    <!-- Local Files -->
    <link rel="stylesheet" href="./index.css">
    <script src="./opere.js"></script>
    <script defer src="./index.js"></script>
</head>

<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <span class="navbar-brand mb-0 h1"><i class="bi bi-bank me-2"></i>Art Dashboard v2.0</span>
            <button class="btn btn-outline-light btn-sm" id="btn-open-add">Aggiungi Opera</button>
        </div>
    </nav>

    <div class="container">
        <!-- Barra dei Filtri -->
        <div class="row g-3 mb-4 align-items-center bg-white p-3 rounded shadow-sm">
            <div class="col-md-6">
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-search"></i></span>
                    <input type="text" id="search-input" class="form-control" placeholder="Cerca per artista...">
                </div>
            </div>
            <div class="col-md-6">
                <div class="form-check form-switch">
                    <input class="form-check-input" type="checkbox" id="filter-available">
                    <label class="form-check-input-label fw-semibold" for="filter-available">Mostra solo opere disponibili</label>
                </div>
            </div>
        </div>

        <!-- Tabella dati -->
        <div class="card shadow-sm mb-4">
            <div class="table-responsive">
                <table class="table table-striped table-hover align-middle mb-0" id="main-table">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Titolo</th>
                            <th>Artista</th>
                            <th>Anno</th>
                            <th>Valore (€)</th>
                            <th>Stato</th>
                            <th style="width: 40px;"></th>
                            <th style="width: 40px;"></th>
                        </tr>
                    </thead>
                    <tbody>
                          <!-- Dinamico -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Widget Valore Totale Inventario -->
        <div class="row">
            <div class="col-md-4 offset-md-8">
                <div class="card bg-primary text-white text-end shadow-sm">
                    <div class="card-body">
                        <h6 class="card-subtitle mb-1 text-white-50">Valore Totale Visibile</h6>
                        <h3 class="card-title mb-0" id="total-value-display">€ 0</h3>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modale Dettagli -->
    <div class="modal fade" id="modal-details" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Scheda Tecnica Opera</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="modal-details-body">
                    <!-- Dinamico
                        <div class="text-center mb-3">
                            <div class="p-3 bg-light text-muted border text-center rounded">
                                <img src=""  class="img-fluid rounded shadow-sm" >
                            </div>
                        </div>
                        <div class="row g-2">
                            <div class="col-4 fw-bold text-end">ID:</div><div class="col-8"> id </div>
                            <div class="col-4 fw-bold text-end">Titolo:</div><div class="col-8"> titolo </div>
                            <div class="col-4 fw-bold text-end">Artista:</div><div class="col-8"> artista </div>
                            <div class="col-4 fw-bold text-end">Anno:</div><div class="col-8"> anno </div>
                            <div class="col-4 fw-bold text-end">Valore:</div><div class="col-8">€ valore</div>
                        </div>                                      
                    -->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-warning" id="btn-mark-sold">Segna come Venduta</button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Chiudi</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modale Inserimento -->
    <div class="modal fade" id="modal-add" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Nuovo Elemento Inventario</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="alert alert-danger d-none" id="add-error-alert">  </div>
                    <form id="add-form">
                        <div class="mb-2"><label class="form-label small fw-bold">ID Opera</label><input type="text" class="form-control form-control-sm" id="txtId"></div>
                        <div class="mb-2"><label class="form-label small fw-bold">Titolo</label><input type="text" class="form-control form-control-sm" id="txtTitolo"></div>
                        <div class="mb-2"><label class="form-label small fw-bold">Artista</label><input type="text" class="form-control form-control-sm" id="txtArtista"></div>
                        <div class="mb-2"><label class="form-label small fw-bold">Anno Realizzazione</label><input type="text" class="form-control form-control-sm" id="txtAnno"></div>
                        <div class="mb-2"><label class="form-label small fw-bold">Valore Stimato (€)</label><input type="text" class="form-control form-control-sm" id="txtValore"></div>
                        <div class="mb-2"><label class="form-label small fw-bold">Nome File Immagine</label><input type="text" class="form-control form-control-sm" id="img" placeholder="es: quadro.jpg"></div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annulla</button>
                    <button type="button" class="btn btn-success" id="btn-save-new">Salva Opera</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
