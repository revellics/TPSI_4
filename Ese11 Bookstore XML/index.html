<!DOCTYPE HTML>
<html>

<head>
    <title>XML</title>	
    <meta charset="utf-8" />
    <link rel="stylesheet" href="index.css">
	<script type="application/javascript" src="./data/bookstore.js"></script>
	<script defer type="application/javascript" src="./index.js"></script>
</head>

<body>
    <header>
		<div class="headerBtn"> Vista Elenco </div>
		<div class="headerBtn"> Vista Dettagli </div>
		<div class="headerBtn"> Aggiungi Nuovo </div>
		<div class="headerBtn"> Salva su Disco </div>
	</header>

    <main id="container">
        <h1>Book Store</h1>
		
		<div id="list-view"> 
		    <div class="nBooks"> </div>
			<table border="1">
				<thead>			
					<tr>
						<th>ID</th>
						<th>Titolo</th>
						<th>Categoria</th>
						<th>Lingua</th>
						<th>Autori</th>
						<th>Anno</th>
						<th>Prezzo</th>
						<th> </th>  <!-- pulsante delete -->
					</tr>			
				</thead>
				<tbody id="tabLibri">

				</tbody>
			</table>			
		</div>
		
		<div id="details-view">
			<div class="details"> </div>
			<div class="buttons">
				<button class="button">Primo</button>
				<button class="button">Indietro</button>
				<span> </span>
				<button class="button">Avanti</button>
				<button class="button">Ultimo</button>
				<button class="button">Elimina</button>
			</div>
		</div>


		<div id="add-view"> 
			<div class="details"> 
			    <label> Id : </label>
				<input type="number" id="txtId">
				
			    <label> Titolo : </label>
				<input type="text" id="txtTitolo">
				
			    <label> Categoria : </label>
				<input type="text" id="txtCategoria">
				
			    <label> Lingua : </label>
				<input type="text" id="txtLingua">
				
			    <label> Autori : </label>
				<input type="text" id="txtAutori">
				
			    <label> Anno : </label>
				<input type="number" id="txtAnno" min="1900" max="">
				
			    <label> Prezzo : </label>
				<input type="number" id="txtPrezzo">
			</div>
			
			<div class="buttons">
				<button class="button">Add</button>
			</div>
		</div>
		
    </main>

</body>
</html>
